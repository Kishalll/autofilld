<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Test Form</title>
    <style>
        body { font-family: sans-serif; padding: 12px; line-height: 1.4; color: #333; }
        .form-group { margin-bottom: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 3px; font-size: 13px; }
        input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; font-size: 14px; border: 1px solid #aaa; border-radius: 4px; }
        button { padding: 10px 16px; font-size: 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; margin-top: 10px; width: 100%; }
    </style>
</head>
<body>
    <h3>Debug HTML Checkout Form</h3>
    <form id="checkout_form" method="post" action="javascript:void(0);">
        <div class="form-group">
            <label for="cust_name">Customer Name</label>
            <input type="text" id="cust_name" name="cust_name" placeholder="Full name">
        </div>
        <div class="form-group">
            <label for="cust_email">Contact Email</label>
            <input type="text" id="cust_email" name="cust_email" placeholder="Email">
        </div>
        <div class="form-group">
            <label for="cust_phone">Telephone</label>
            <input type="text" id="cust_phone" name="cust_phone" placeholder="Phone">
        </div>
        <div class="form-group">
            <label for="cust_street">Delivery Address</label>
            <input type="text" id="cust_street" name="cust_street" placeholder="Address Line 1">
        </div>
        <div class="form-group">
            <label for="cust_apt">Apt / Suite</label>
            <input type="text" id="cust_apt" name="cust_apt" placeholder="Address Line 2">
        </div>
        <div class="form-group">
            <label for="cust_city">Town / City</label>
            <input type="text" id="cust_city" name="cust_city" placeholder="City">
        </div>
        <div class="form-group">
            <label for="cust_state">Province / State</label>
            <input type="text" id="cust_state" name="cust_state" placeholder="State">
        </div>
        <div class="form-group">
            <label for="cust_zip">Postcode</label>
            <input type="text" id="cust_zip" name="cust_zip" placeholder="Postal Code">
        </div>
        <div class="form-group">
            <label for="cust_country">Country</label>
            <input type="text" id="cust_country" name="cust_country" placeholder="Country">
        </div>
        <div class="form-group">
            <label for="cust_token">Security Token</label>
            <input type="text" id="cust_token" name="cust_token" placeholder="Internal Token">
        </div>
        <button type="submit" id="btn_submit">Submit Order</button>
    </form>
</body>
</html>
